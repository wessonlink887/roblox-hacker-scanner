
<script>
function checkUser() {
  const name = document.getElementById("username").value.trim();
  const result = document.getElementById("result");

  if (!name) {
    result.textContent = "Enter a username first!";
    return;
  }

  const searchUrl =
    "https://www.roblox.com/search/users?keyword=" +
    encodeURIComponent(name);

  result.innerHTML = "";

  const message = document.createElement("p");
  message.textContent = "Open Roblox to search for " + name;

  const link = document.createElement("a");
  link.href = searchUrl;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = "OPEN ROBLOX SEARCH";
  link.style.color = "#42e88b";

  result.append(message, link);
}
</script>
